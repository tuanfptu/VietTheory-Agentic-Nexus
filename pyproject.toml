[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viettheory-rag"
version = "0.1.0"
description = "Citation-grounded RAG for Vietnamese political-theory textbooks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "VietTheory-RAG contributors" }]
dependencies = [
  "PyMuPDF>=1.24,<2",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
]
retrieval = [
  "faiss-cpu>=1.9,<2",
  "huggingface-hub>=0.30,<2",
  "numpy>=1.26,<2.3",
  "sentence-transformers>=4,<6",
]
app = [
  "fastapi>=0.115,<1",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
viettheory-extract = "viettheory.extraction.cli:main"
viettheory-ocr = "viettheory.extraction.ocr_cli:main"
viettheory-chunk = "viettheory.chunking.cli:main"
viettheory-structure-chunk = "viettheory.chunking.structured_cli:main"
viettheory-index = "viettheory.retrieval.cli:main"
viettheory-ui = "viettheory.frontend.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viettheory = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true
pretty = true
